spring.application.name=skygo-backend
server.port=8080

spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=skygo;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:skygo_app}
spring.datasource.password=${DB_PASSWORD:change-me}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true