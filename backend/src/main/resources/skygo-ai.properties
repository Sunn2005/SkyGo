skygo.ai.enabled=${SKYGO_AI_ENABLED:false}
skygo.ai.chat-model=${SKYGO_AI_CHAT_MODEL:gemini-3.8-flash}
skygo.ai.embedding-model=${SKYGO_AI_EMBEDDING_MODEL:gemini-embedding-001}
skygo.ai.embedding-dimensions=${SKYGO_AI_EMBEDDING_DIMENSIONS:768}
skygo.ai.timeout=${SKYGO_AI_TIMEOUT:30s}
skygo.ai.top-k=${SKYGO_AI_TOP_K:4}
skygo.ai.similarity-threshold=${SKYGO_AI_SIMILARITY_THRESHOLD:0.65}
skygo.ai.max-output-tokens=${SKYGO_AI_MAX_OUTPUT_TOKENS:2048}
skygo.ai.chat.max-tool-rounds=${SKYGO_AI_CHAT_MAX_TOOL_ROUNDS:2}
skygo.ai.chat.max-tool-calls=${SKYGO_AI_CHAT_MAX_TOOL_CALLS:4}
skygo.ai.chat.model-calls-per-minute=${SKYGO_AI_CHAT_MODEL_CALLS_PER_MINUTE:4}
skygo.ai.chat.airports.top-k=${SKYGO_AI_AIRPORT_TOP_K:5}
skygo.ai.chat.airports.minimum-similarity=${SKYGO_AI_AIRPORT_MIN_SIMILARITY:0.65}
skygo.ai.chat.airports.auto-select-similarity=${SKYGO_AI_AIRPORT_AUTO_SELECT_SIMILARITY:0.85}
skygo.ai.chat.airports.minimum-score-gap=${SKYGO_AI_AIRPORT_MIN_SCORE_GAP:0.10}
skygo.ai.index.enabled=${SKYGO_AI_INDEX_ENABLED:false}
skygo.ai.index.fixed-delay=${SKYGO_AI_INDEX_FIXED_DELAY:5m}
skygo.ai.index.batch-size=${SKYGO_AI_INDEX_BATCH_SIZE:8}
skygo.ai.index.batch-delay=${SKYGO_AI_INDEX_BATCH_DELAY:10s}
skygo.ai.index.flight-days=${SKYGO_AI_INDEX_FLIGHT_DAYS:30}
skygo.ai.index.booking-days=${SKYGO_AI_INDEX_BOOKING_DAYS:15}
skygo.ai.index.max-documents=${SKYGO_AI_INDEX_MAX_DOCUMENTS:50000}
