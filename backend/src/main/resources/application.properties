spring.application.name=skygo-backend
skygo.airline.code=SG
skygo.airline.name=SkyGo
skygo.seat-hold.cleanup-enabled=true
skygo.seat-hold.cleanup-delay-ms=30000
skygo.seat-hold.cleanup-batch-size=100
skygo.review.encryption-key=${SKYGO_REVIEW_ENCRYPTION_KEY:}
skygo.review.key-id=${SKYGO_REVIEW_KEY_ID:v1}
skygo.booking.document-encryption-key=${SKYGO_BOOKING_DOCUMENT_ENCRYPTION_KEY:}
skygo.booking.document-key-id=${SKYGO_BOOKING_DOCUMENT_KEY_ID:v1}
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/skygo?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:phanvanquan}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

# JDBC uses UTC for DATETIME values; MariaDB remains the session authority.
spring.datasource.hikari.connection-init-sql=SET time_zone = '+00:00'
spring.flyway.clean-disabled=true
skygo.auth.session-ttl=${AUTH_SESSION_TTL:24h}
