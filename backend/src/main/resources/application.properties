spring.application.name=skygo-backend
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/skygo?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:phanvanquan}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

# JDBC uses UTC for DATETIME values; MariaDB remains the session authority.
spring.datasource.hikari.connection-init-sql=SET time_zone = '+00:00'
spring.flyway.clean-disabled=true
skygo.auth.session-ttl=${AUTH_SESSION_TTL:24h}
